<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a1a" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Default metadata (per-route values override these via React 19's <head> hoisting) -->
    <title>Moojic — AI-Powered In-Store Audio, Digital Signage & AV Hardware</title>
    <meta name="description" content="Moojic helps brands sound, look, and feel exactly the way they were meant to. AI-curated in-store radio, digital signage, and AV hardware across 20,000+ locations in 12 countries." />
    <meta name="keywords" content="in-store radio, digital signage, AV hardware, retail audio, brand music, sonic branding, AI music curation, in-store experience, Moojic" />
    <meta name="author" content="Moojic" />
    <link rel="canonical" href="https://moojicwebsite.vercel.app/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moojic" />
    <meta property="og:title" content="Moojic — AI-Powered In-Store Audio, Digital Signage & AV Hardware" />
    <meta property="og:description" content="Moojic helps brands sound, look, and feel exactly the way they were meant to. AI-curated in-store radio, digital signage, and AV hardware across 20,000+ locations." />
    <meta property="og:url" content="https://moojicwebsite.vercel.app/" />
    <meta property="og:image" content="https://moojicwebsite.vercel.app/assets/ai_curation_visual.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MoojicR" />
    <meta name="twitter:title" content="Moojic — AI-Powered In-Store Audio, Digital Signage & AV Hardware" />
    <meta name="twitter:description" content="AI-curated in-store radio, digital signage, and AV hardware across 20,000+ locations." />
    <meta name="twitter:image" content="https://moojicwebsite.vercel.app/assets/ai_curation_visual.jpg" />

    <!-- Self-hosted fonts: preload the most-used weights so they're parallel
         with the HTML rather than serial after CSS. @font-face declarations
         live in index.css. -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-800.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
